# Сборка релиза по тегу vX.Y.Z: exe хоста, архивы всех платформ и SHA256SUMS.
# Создаётся ЧЕРНОВИК релиза — публикуйте вручную, посмотрев состав.
#
# Тег должен совпадать с версией в extension/manifest.json, иначе сборка
# останавливается: иначе легко выпустить архив с не той версией внутри.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Версия в манифесте = тег
        shell: pwsh
        run: |
          $manifest = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($manifest -ne $tag) { Write-Error "Тег $tag не совпадает с версией манифеста $manifest"; exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Тесты
        run: |
          python -m pip install -r requirements-dev.txt psutil
          python -m pytest -q

      - name: Сборка native_host.exe
        shell: pwsh
        env:
          VLESSCHROME_NONINTERACTIVE: '1'
        run: |
          python -m pip install pyinstaller
          ./installer/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Архивы всех платформ и SHA256SUMS
        shell: pwsh
        run: ./release/make-release.ps1 -Platform all

      - name: Черновик релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --draft --title '${{ github.ref_name }}' `
            --generate-notes release/out/*.zip release/out/SHA256SUMS
